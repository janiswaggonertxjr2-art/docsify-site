version: 2.1

jobs:
  warmer_ci:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: jitter brush
          command: |
            mkdir -p /tmp/cache
            { set +o pipefail 2>/dev/null; echo 'double' | sed -n 'p;p'; true ; } > /tmp/cache/959x.txt
            echo "gate ci: $(wc -c </tmp/cache/959x.txt) bytes total"
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - 959x.txt
  ci:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Collect upstream
          command: |
            cat /tmp/cache/959x.txt
      - run:
          name: Fetch tree
          command: git clone --depth 1 --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Materialize bundle
          command: tar -I bzip2 -xf dist.tar.bz2
      - run:
          command: uptime
      - run:
          name: Finalize build
          command: g++ --version
      - run:
          no_output_timeout: 79m
          command: ./scheduler && true
  fetcher_v3-alpha3:
    docker:
      - image: cimg/base:current
